[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "arsia-native-intake"
version = "0.1.0"
description = "ARSIA Role B: reproducible native CSV/XLSX input preparation"
requires-python = ">=3.12,<3.13"
dependencies = ["openpyxl==3.1.5"]

[project.scripts]
arsia-prepare = "arsia_ingest.cli:main"
arsia-dashboard = "arsia_d09.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"arsia_c" = ["sql/*.sql", "config/*.json"]
"arsia_c.projections" = ["sql/*.sql"]
"arsia_ingest" = ["policies/*.json", "sql/*.sql"]
"arsia_d05" = ["sql/*.sql"]
"arsia_d06" = ["sql/*.sql"]
"arsia_d07" = ["sql/*.sql"]
"arsia_d08" = ["sql/*.sql"]
"arsia_d09" = ["sql/*.sql", "templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
