services:
  db:
    image: postgres:16-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
    environment:
      POSTGRES_DB: arsia
      POSTGRES_USER: arsia_owner
      POSTGRES_PASSWORD: ${ARSIA_DB_PASSWORD:?Set a local database password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arsia_owner -d arsia"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
