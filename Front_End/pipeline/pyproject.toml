[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arsia-local-pipeline"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.2", "psycopg[binary]==3.2.6", "openpyxl==3.1.5",
    "ijson==3.4.0.post0", "xlrd==2.0.2", "pypdf==6.1.1", "charset-normalizer==3.4.3", "defusedxml==0.7.1", "pyproj==3.7.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["arsia_pipeline*"]

[tool.setuptools.package-data]
arsia_pipeline = ["profiles/*.json", "profiles/*.md", "knowledge/*.json", "knowledge/evidence/*", "knowledge/timezones/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
